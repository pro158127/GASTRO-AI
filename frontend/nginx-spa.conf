server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo (por ejemplo /iniciar-sesion al recargar)
    # devuelve index.html y la resuelve react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
