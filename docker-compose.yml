services:
  nginx:
    image: nginx:alpine
    container_name: gastroai_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - gastroai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: gastroai_frontend
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - gastroai_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: gastroai_api
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - gastroai_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: gastroai_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - gastroai_net

  redis:
    image: redis:7-alpine
    container_name: gastroai_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - gastroai_net

  postgres:
    image: postgres:16-alpine
    container_name: gastroai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gastroai_net

  minio:
    image: bitnamilegacy/minio:latest
    container_name: gastroai_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gastroai_net

networks:
  gastroai_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
