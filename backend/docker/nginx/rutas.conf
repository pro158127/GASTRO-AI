# Rutas compartidas por nginx.conf (desarrollo, http) y nginx.prod.conf (producción,
# https). Se incluyen DENTRO de cada bloque server; no van solas.

# 10 MB de imagen (RF-D02) + el sobre del multipart. Más que eso lo corta nginx;
# entre 10 y 12 MB lo rechaza la API con su 413 en JSON, que es el que entiende el front
client_max_body_size 12m;

# Con variables, nginx arranca aunque el frontend no exista todavía (da 502 en / y ya)
set $api http://api:8000;
set $frontend http://frontend:80;

# El 429 del límite sale con el mismo formato de error que la API, no con HTML de nginx
limit_req_status 429;
error_page 429 = @demasiados_intentos;

# Todo lo que recibe contraseñas o códigos, más el QR (defensa en profundidad)
location ~ ^/api/v1/auth/(login|contrasena/cambiar|totp/iniciar|totp/verificar|totp/vincular)$ {
    limit_req zone=acceso burst=5 nodelay;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Las que reciben un documento: límite pa que no se usen pa adivinar pacientes
location ~ ^/api/v1/(pacientes/(consulta|analisis/buscar)|casos-recibidos/buscar)$ {
    limit_req zone=consulta burst=10 nodelay;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Tiempo real (SSE): la conexión queda abierta y cada evento tiene que salir de una
location = /api/v1/eventos {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    # La API manda un ping cada 15 s; esto solo corta un stream que quedó colgado
    proxy_read_timeout 1h;
}

location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    # La IP real del usuario: la bitácora la necesita (RNF-03, RNF-05, RF-U12 CA 4).
    # OJO: se REEMPLAZA el X-Forwarded-For con la IP que ve nginx. Con
    # $proxy_add_x_forwarded_for el cliente mandaba «X-Forwarded-For: 1.2.3.4», uvicorn
    # tomaba el primero de la lista y la bitácora guardaba una IP inventada (CWE-348).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El análisis se procesa en el worker; la API contesta 202 rápido, no hace falta más
    proxy_read_timeout 60s;
}

location @demasiados_intentos {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"error":{"codigo":"DEMASIADOS_INTENTOS","mensaje":"Demasiados intentos. Espera un momento.","id_solicitud":"req_$request_id"}}';
}

location / {
    proxy_pass $frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}
