# Producción (https). La usa docker-compose.prod.yml en lugar de nginx.conf.
#   80   → redirige todo a https
#   443  → la SPA y la API (mismas rutas que en desarrollo: rutas.conf)
#   9000 → MinIO por https, solo pa abrir las URL firmadas de imágenes y mapas de calor
#
# RNF-02: todo el tráfico va por HTTPS. Además la cookie de sesión es Secure: por http el
# navegador ni la guarda, así que sin esto no se puede ni iniciar sesión.
#
# Certificados en ${NGINX_CERTIFICADOS:-./backend/docker/nginx/certs} (fuera de git):
#   fullchain.pem  certificado + cadena
#   privkey.pem    llave privada

resolver 127.0.0.11 valid=10s ipv6=off;

# Igual que en desarrollo: el registro de accesos sin la query string (U-13)
log_format sin_consulta '$remote_addr - [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=consulta:10m rate=30r/m;
# Máximo de streams de eventos (SSE) abiertos a la vez por IP: cada pestaña abre uno
limit_conn_zone $binary_remote_addr zone=eventos:10m;

ssl_certificate /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# No decir qué versión de nginx corre
server_tokens off;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sin_consulta;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;   # una sola conexión por pestaña aunque el stream de eventos esté abierto
    server_name _;
    access_log /var/log/nginx/access.log sin_consulta;

    # El navegador ya no vuelve a intentar http durante un año
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    include /etc/nginx/gastroia/rutas.conf;
}

# MinIO: las URL firmadas llevan este host y puerto (S3_PUBLIC_ENDPOINT_URL=https://<dominio>:9000).
# El Host se pasa tal cual porque es parte de la firma; si se cambia, MinIO responde 403.
server {
    listen 9000 ssl;
    server_name _;
    access_log /var/log/nginx/access.log sin_consulta;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;
    set $minio http://minio:9000;

    location / {
        proxy_pass $minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
