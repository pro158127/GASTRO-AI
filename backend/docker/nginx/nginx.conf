# Puerta de entrada única: el navegador solo habla con nginx (puerto 80).
#   /api/  → api:8000 (FastAPI)
#   /      → frontend:80 (la SPA; ese contenedor vive en el repo del equipo)

# DNS interno de Docker re-resuelto cada 10 s: si recreas api o frontend, nginx no se
# queda con la IP vieja y no salen 502 fantasma. Truco tomado del repo del equipo.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 10 MB de imagen (RF-D02) + el sobre del multipart. Más que eso lo corta nginx;
    # entre 10 y 12 MB lo rechaza la API con su 413 en JSON, que es el que entiende el front
    client_max_body_size 12m;

    # Con variables, nginx arranca aunque el frontend no exista todavía (da 502 en / y ya)
    set $api http://api:8000;
    set $frontend http://frontend:80;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # La IP real del usuario: la bitácora la necesita (RNF-03, RNF-05)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El análisis se procesa en el worker; la API contesta 202 rápido, no hace falta más
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
