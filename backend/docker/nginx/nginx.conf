# Desarrollo (http, puerto 80). Producción: nginx.prod.conf (https). Las rutas de los dos
# están en rutas.conf.
#   /api/  → api:8000 (FastAPI)
#   /      → frontend:80 (la SPA; ese contenedor vive en el repo del equipo)

# DNS interno de Docker re-resuelto cada 10 s: si recreas api o frontend, nginx no se
# queda con la IP vieja y no salen 502 fantasma. Truco tomado del repo del equipo.
resolver 127.0.0.11 valid=10s ipv6=off;

# U-13: el registro de accesos guarda la ruta SIN la query string ($uri, no $request).
# Así la búsqueda de usuarios (?q=nombre o correo) y los filtros no quedan en los logs.
log_format sin_consulta '$remote_addr - [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent $request_time';

# Límite por IP pa los endpoints que reciben contraseña o código (RF-U12, RNF-03). El
# bloqueo por cuenta lo hace la API; esto frena a quien prueba muchas cuentas desde la
# misma IP. 10 por minuto con ráfaga de 5 alcanza de sobra pa una persona de verdad.
limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
# La consulta de paciente recibe un documento: con límite pa que nadie la use pa adivinar
# documentos a punta de intentos (contrato §3.3). Más holgado: el doctor la usa de verdad.
limit_req_zone $binary_remote_addr zone=consulta:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sin_consulta;

    include /etc/nginx/gastroia/rutas.conf;
}
