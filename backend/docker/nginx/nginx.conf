# Puerta de entrada única: el navegador solo habla con nginx (puerto 80).
#   /api/  → api:8000 (FastAPI)
#   /      → frontend:80 (la SPA; ese contenedor vive en el repo del equipo)

# DNS interno de Docker re-resuelto cada 10 s: si recreas api o frontend, nginx no se
# queda con la IP vieja y no salen 502 fantasma. Truco tomado del repo del equipo.
resolver 127.0.0.11 valid=10s ipv6=off;

# Límite por IP pa los endpoints que reciben contraseña o código (RF-U12, RNF-03). El
# bloqueo por cuenta lo hace la API; esto frena a quien prueba muchas cuentas desde la
# misma IP. 10 por minuto con ráfaga de 5 alcanza de sobra pa una persona de verdad.
limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # 10 MB de imagen (RF-D02) + el sobre del multipart. Más que eso lo corta nginx;
    # entre 10 y 12 MB lo rechaza la API con su 413 en JSON, que es el que entiende el front
    client_max_body_size 12m;

    # Con variables, nginx arranca aunque el frontend no exista todavía (da 502 en / y ya)
    set $api http://api:8000;
    set $frontend http://frontend:80;

    # El 429 del límite sale con el mismo formato de error que la API, no con HTML de nginx
    limit_req_status 429;
    error_page 429 = @demasiados_intentos;

    location ~ ^/api/v1/auth/(login|totp/verificar|totp/vincular)$ {
        limit_req zone=acceso burst=5 nodelay;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # La IP real del usuario: la bitácora la necesita (RNF-03, RNF-05, RF-U12 CA 4).
        # OJO: se REEMPLAZA el X-Forwarded-For con la IP que ve nginx. Con
        # $proxy_add_x_forwarded_for el cliente mandaba «X-Forwarded-For: 1.2.3.4», uvicorn
        # tomaba el primero de la lista y la bitácora guardaba una IP inventada (CWE-348).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El análisis se procesa en el worker; la API contesta 202 rápido, no hace falta más
        proxy_read_timeout 60s;
    }

    location @demasiados_intentos {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"codigo":"DEMASIADOS_INTENTOS","mensaje":"Demasiados intentos. Espera un momento.","id_solicitud":"req_$request_id"}}';
    }

    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
